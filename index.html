<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanford Reach</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <!-- The game draws into this canvas. Everything else on the page is UI. -->
    <canvas id="game"></canvas>

    <!-- Shown while the world is being generated, then fades out. -->
    <div id="loading">
      <div class="loading-inner">
        <h1>HANFORD REACH</h1>
        <p id="loading-status">waking the valley&hellip;</p>
        <div class="loading-bar"><div id="loading-fill"></div></div>
      </div>
    </div>

    <!-- Click-to-start overlay. Browsers only allow pointer lock from a click. -->
    <div id="start" class="hidden">
      <div class="start-inner">
        <h2>Ready</h2>
        <p>Click to look around</p>
      </div>
    </div>

    <!-- In-game heads-up display. -->
    <div id="hud" class="hidden">
      <div id="controls">
        <div class="row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>move</span></div>
        <div class="row"><kbd>Shift</kbd><span>run</span></div>
        <div class="row"><kbd>Space</kbd><span>jump</span></div>
        <div class="row"><kbd>Mouse</kbd><span>look</span></div>
        <div class="row"><kbd>Esc</kbd><span>release cursor</span></div>
        <div class="row"><kbd>H</kbd><span>hide this</span></div>
        <div class="row"><kbd>V</kbd><span>first / third person</span></div>
        <div class="row"><kbd>[</kbd><kbd>]</kbd><span>mouse speed</span></div>
        <div class="row"><kbd>Q</kbd><span>change quality</span></div>
        <div class="row"><kbd>F3</kbd><span>performance</span></div>
      </div>
      <div id="stats" class="hidden"></div>
      <div id="toast" class="faded"></div>
      <div id="reticle" class="hidden"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
